# Thin consumer overlay. Pulls in the parameterized base from
# @alignfirst/openclaw-test. Requires Docker Compose v2.20+.
#
# `.env.local` needs OPENROUTER_API_KEY (judge), OPENCLAW_CODEX_HOME (Terra),
# OPENCLAW_WORKSPACE_DIR, ALIGNFIRST_REPO_DIR, CODING_AGENT.
# All other paths default to subdirs of the project dir; override in
# .env.local if you need a different layout. OPENCLAW_TEST_PROJECT_DIR, OPENCLAW_TEST_PACKAGE_DIR,
# ASSISTANT_UID, ASSISTANT_GID are set automatically by `openclaw-test env|run`.

include:
  - ./node_modules/@alignfirst/openclaw-test/docker-compose.yml

volumes:
  openclaw-codex-home:
  fixture-projects:

services:
  gateway:
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      # The entrypoint writes both into the aligndev config.
      CODING_AGENT: ${CODING_AGENT:?set CODING_AGENT to codex or claude}
      CODING_AGENT_MODELS: ${CODING_AGENT_MODELS:-}
      # `codex` is the mock shim here (symlinked in the image, first on PATH), so no real Codex
      # reads this. It points at the IPC volume, which the runner also mounts, so the mocked CLI
      # can write the thread rollout `aligndev code` reads the context occupancy from.
      CODEX_HOME: /var/run/openclaw-test-ipc/codex-home
    # Import the mounted Codex credential and write the aligndev config, then hand off
    # to the base stack's gateway command, which stays the single owner of the start line.
    entrypoint: ["/usr/local/bin/gateway-entrypoint"]
    volumes:
      - ${OPENCLAW_CODEX_HOME:-openclaw-codex-home}:/home/assistant/.codex:ro
      - fixture-projects:/home/assistant/projects
      # Live-mount the built monorepo so the `aligndev` and `alignfirst` wrappers resolve
      # to this checkout, playbook templates included. Run `npm run build` at the root
      # first so aligndev, alignfirst, and docmap have built output.
      - ${ALIGNFIRST_REPO_DIR:?set ALIGNFIRST_REPO_DIR to the monorepo root}:/opt/alignfirst:ro

  runner:
    environment:
      OPENCLAW_TEST_JUDGE_MODEL: ${OPENCLAW_TEST_JUDGE_MODEL:-openrouter/anthropic/claude-haiku-4.5}
      CODING_AGENT: ${CODING_AGENT:?set CODING_AGENT to codex or claude}
      CODING_AGENT_MODELS: ${CODING_AGENT_MODELS:-}
    volumes:
      - fixture-projects:/home/assistant/projects
