# Thin consumer overlay. Pulls in the parameterized base from
# @alignfirst/openclaw-test. Requires Docker Compose v2.20+.
#
# `.env.local` needs ANTHROPIC_API_KEY, OPENCLAW_WORKSPACE_DIR,
# ALIGNFIRST_PLAYBOOK_SKILL_DIR.
# All other paths default to subdirs of the project dir; override in
# .env.local if you need a different layout. OPENCLAW_TEST_PROJECT_DIR, OPENCLAW_TEST_PACKAGE_DIR,
# ASSISTANT_UID, ASSISTANT_GID are set automatically by `openclaw-test env|run`.

include:
  - ./node_modules/@alignfirst/openclaw-test/docker-compose.yml

volumes:
  openclaw-codex-home:
  fixture-projects:

services:
  gateway:
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ALIGNFIRST_CODE_AGENT: ${ALIGNFIRST_CODE_AGENT:?set ALIGNFIRST_CODE_AGENT to codex or claude}
      ALIGNFIRST_CODE_MODELS: ${ALIGNFIRST_CODE_MODELS:-}
      # `codex` is the mock shim here (symlinked in the image, first on PATH), so no real Codex
      # reads this. It points at the IPC volume, which the runner also mounts, so the mocked CLI
      # can write the thread rollout alcode reads the context occupancy from.
      CODEX_HOME: /var/run/openclaw-test-ipc/codex-home
    command:
      - sh
      - -c
      - |
        set -e
        /usr/local/bin/exec-watcher &
        npx openclaw gateway run --port 18789 --bind loopback --auth none &
        gateway_pid=$!
        import_home=$$(mktemp -d)
        cleanup() {
          if [ -n "$$import_home" ]; then rm -rf "$$import_home"; fi
          kill -TERM "$$gateway_pid" 2>/dev/null || true
        }
        trap cleanup EXIT TERM INT
        until node -e "require('net').connect(18789, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"; do
          kill -0 "$$gateway_pid" 2>/dev/null
          sleep 1
        done
        cp /home/assistant/.codex/auth.json "$$import_home/auth.json"
        if [ -f /home/assistant/.codex/models_cache.json ]; then
          cp /home/assistant/.codex/models_cache.json "$$import_home/models_cache.json"
        fi
        npx openclaw migrate apply codex --from "$$import_home" --agent main --include-secrets --item auth:openai --yes
        rm -rf "$$import_home"
        import_home=""
        kill -TERM "$$gateway_pid"
        wait "$$gateway_pid" || true
        npx openclaw gateway run --port 18789 --bind loopback --auth none &
        gateway_pid=$!
        until node -e "require('net').connect(18789, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"; do
          kill -0 "$$gateway_pid" 2>/dev/null
          sleep 1
        done
        touch /tmp/openclaw-auth-ready
        wait "$$gateway_pid"
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/openclaw-auth-ready && node -e "require('net').connect(18789, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
    volumes:
      - ${OPENCLAW_CODEX_HOME:-openclaw-codex-home}:/home/assistant/.codex:ro
      - fixture-projects:/home/assistant/projects
      # Live-mount the playbook skill over its copy in OpenClaw's managed skill
      # directory. Set in .env.local (relative to this dir, e.g.
      # ../skills/alignfirst-openclaw-playbook).
      - ${ALIGNFIRST_PLAYBOOK_SKILL_DIR:?set ALIGNFIRST_PLAYBOOK_SKILL_DIR to the playbook skill directory}:/home/assistant/.openclaw/skills/alignfirst-openclaw-playbook
      # Live-mount the built monorepo so the alcode and alignfirst wrappers resolve
      # to this checkout. Run `npm run build` at the root first so alcode, alignfirst,
      # and docmap have built output.
      - ${ALIGNFIRST_REPO_DIR:?set ALIGNFIRST_REPO_DIR to the monorepo root}:/opt/alignfirst:ro

  runner:
    environment:
      OPENCLAW_TEST_JUDGE_MODEL: ${OPENCLAW_TEST_JUDGE_MODEL:-openrouter/anthropic/claude-haiku-4.5}
      ALIGNFIRST_CODE_AGENT: ${ALIGNFIRST_CODE_AGENT:?set ALIGNFIRST_CODE_AGENT to codex or claude}
    volumes:
      - fixture-projects:/home/assistant/projects
