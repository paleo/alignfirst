# Thin consumer overlay. Pulls in the parameterized base from
# @paleo/openclaw-test. Requires Docker Compose v2.20+.
#
# `.env.local` needs ANTHROPIC_API_KEY, OPENCLAW_WORKSPACE_DIR,
# ALIGNFIRST_COACHING_SKILL_DIR, OPENCLAW_CODER_PLAYBOOK_SKILL_DIR.
# All other paths default to subdirs of the project dir; override in
# .env.local if you need a different layout. OPENCLAW_TEST_PROJECT_DIR, OPENCLAW_TEST_PACKAGE_DIR,
# CLAW_UID, CLAW_GID are set automatically by `openclaw-test env|run`.

include:
  - ./node_modules/@paleo/openclaw-test/docker-compose.yml

volumes:
  fixture-projects:

services:
  gateway:
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Callback wiring for the real alcoach CLI. When alcoach runs a coding
      # session it POSTs back here on completion; the gateway serves /hooks/*
      # on its own HTTP port (18789, per the base stack's `gateway run --port`).
      # The `/hooks/coding` path is a mapping whose transform derives the
      # delivery channel from the session key (the built-in /hooks/agent path
      # can't pick a channel when both mock channels are configured). The token
      # must match `hooks.token` in openclaw.json.
      ALIGNFIRST_COACH_CALLBACK_URL: http://127.0.0.1:18789/hooks/coding
      ALIGNFIRST_COACH_CALLBACK_TOKEN: playbook-hook-token
    volumes:
      - fixture-projects:/home/claw/projects
      # Live-mount the alignfirst-coaching skill over its baked copy so playbook
      # edits iterate without an image rebuild. Set in .env.local (relative to
      # this dir, e.g. ../../skills/alignfirst-coaching = repo-root skills/alignfirst-coaching).
      - ${ALIGNFIRST_COACHING_SKILL_DIR}:/home/claw/.agents/skills/alignfirst-coaching
      # Experiment (ticket 13): procedural dispatcher skill loaded first by the
      # workspace AGENTS.md, so the coaching alignfirst-coaching SKILL.md is no
      # longer the agent's first body read on a turn.
      - ${OPENCLAW_CODER_PLAYBOOK_SKILL_DIR}:/home/claw/.agents/skills/openclaw-coder-playbook
      # Live-mount the built @paleo/alcoach package so the /usr/local/bin/alcoach
      # wrapper resolves to it. ALIGNFIRST_COACH_DIR is the host path to packages/alcoach
      # (build it with `npm run build` first). Read-only: the CLI only reads its
      # own dist/bin/templates and spawns its detached runner from there.
      - ${ALIGNFIRST_COACH_DIR}:/opt/alcoach:ro

  runner:
    environment:
      OPENCLAW_TEST_JUDGE_MODEL: anthropic/claude-haiku-4-5
    volumes:
      - fixture-projects:/home/claw/projects
