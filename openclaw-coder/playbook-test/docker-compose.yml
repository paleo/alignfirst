# Thin consumer overlay. Pulls in the parameterized base from
# @paleo/openclaw-test. Requires Docker Compose v2.20+.
#
# `.env.local` needs ANTHROPIC_API_KEY, OPENCLAW_WORKSPACE_DIR,
# OPENCLAW_CODER_PLAYBOOK_SKILL_DIR.
# All other paths default to subdirs of the project dir; override in
# .env.local if you need a different layout. OPENCLAW_TEST_PROJECT_DIR, OPENCLAW_TEST_PACKAGE_DIR,
# CLAW_UID, CLAW_GID are set automatically by `openclaw-test env|run`.

include:
  - ./node_modules/@paleo/openclaw-test/docker-compose.yml

volumes:
  fixture-projects:

services:
  gateway:
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ALIGNFIRST_CODE_AGENT: ${ALIGNFIRST_CODE_AGENT:?set ALIGNFIRST_CODE_AGENT to codex or claude}
      ALIGNFIRST_CODE_MODELS: ${ALIGNFIRST_CODE_MODELS:-}
    volumes:
      - fixture-projects:/home/claw/projects
      # Live-mount the playbook skill over its baked copy so playbook edits
      # iterate without an image rebuild. Set in .env.local (relative to this
      # dir, e.g. ../../skills/openclaw-coder-playbook).
      - ${OPENCLAW_CODER_PLAYBOOK_SKILL_DIR}:/home/claw/.agents/skills/openclaw-coder-playbook
      # Live-mount the built @paleo/alcode package so the /usr/local/bin/alcode
      # wrapper resolves to it. ALIGNFIRST_CODE_DIR is the host path to packages/alcode
      # (build it with `npm run build` first). Read-only: the CLI only reads its
      # own dist/bin/templates and spawns the selected coding agent from there.
      - ${ALIGNFIRST_CODE_DIR}:/opt/alcode:ro

  runner:
    environment:
      OPENCLAW_TEST_JUDGE_MODEL: anthropic/claude-haiku-4-5
      ALIGNFIRST_CODE_AGENT: ${ALIGNFIRST_CODE_AGENT:?set ALIGNFIRST_CODE_AGENT to codex or claude}
    volumes:
      - fixture-projects:/home/claw/projects
