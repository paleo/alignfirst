name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The Version Packages PR only bumps versions and changelogs. Its jobs skip every step, so the
# required checks still report under their names and pass.
env:
  RELEASE_PR: ${{ github.head_ref == 'changeset-release/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - if: env.RELEASE_PR != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RELEASE_PR != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - if: env.RELEASE_PR != 'true'
        run: npm ci
      - if: env.RELEASE_PR != 'true'
        run: npm run build
      - if: env.RELEASE_PR != 'true'
        run: npm run typecheck
      - if: env.RELEASE_PR != 'true'
        run: npm run lint
      - if: env.RELEASE_PR != 'true'
        run: npm test
      - if: env.RELEASE_PR != 'true'
        run: npm run test:integration --workspace @alignfirst/pi-background --workspace @alignfirst/workspace --workspace aligndev

  node-22:
    runs-on: ubuntu-latest
    steps:
      - if: env.RELEASE_PR != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RELEASE_PR != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: env.RELEASE_PR != 'true'
        name: Install monorepo dependencies on a supported OpenClaw runtime
        run: npm ci
      - if: env.RELEASE_PR != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: env.RELEASE_PR != 'true'
        name: Build invocation provider before CLI consumers
        run: npm run build --workspace @alignfirst/docmap --workspace @alignfirst/workspace && npm run build --workspace alignfirst --workspace aligndev --workspace @alignfirst/pi-subagent --workspace @alignfirst/pi-background
      - if: env.RELEASE_PR != 'true'
        run: npm test --workspace @alignfirst/docmap --workspace alignfirst --workspace aligndev --workspace @alignfirst/workspace --workspace @alignfirst/pi-subagent --workspace @alignfirst/pi-background
      - if: env.RELEASE_PR != 'true'
        run: npm run test:integration --workspace @alignfirst/pi-background --workspace @alignfirst/workspace --workspace aligndev
