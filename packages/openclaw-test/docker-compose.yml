x-common-build: &common-build
  context: ${OPENCLAW_TEST_PROJECT_DIR}
  dockerfile: Dockerfile
  args:
    OPENCLAW_TEST_BASE_TAG: ${OPENCLAW_TEST_BASE_TAG}

# Single source of truth for service mounts. `openclaw-test-ipc` is only used by gateway
# (writer) and runner (reader), but mounting it on `bus` too is harmless and
# lets all three services share one anchor.
x-common-volumes: &common-volumes
  - ${OPENCLAW_WORKSPACE_DIR}:/home/claw/.openclaw/workspace
  - ${OPENCLAW_CONFIG_PATH}:/home/claw/.openclaw/openclaw.json
  - ${OPENCLAW_TEST_PACKAGE_DIR}/dist/:/opt/openclaw-test/src/dist
  - ${OPENCLAW_TEST_SCENARIOS_DIR}:/opt/openclaw-test/src/scenarios
  - ${OPENCLAW_TEST_ARTIFACTS_DIR}:/opt/openclaw-test/artifacts
  - ${OPENCLAW_TEST_GATEWAY_LOGS_DIR}:/home/claw/.openclaw/logs
  - openclaw-test-ipc:/var/run/openclaw-test-ipc

volumes:
  openclaw-test-ipc:

services:
  bus:
    build: *common-build
    user: claw
    working_dir: /opt/openclaw-test/src
    command: ["node", "/opt/openclaw-test/src/dist/bus.js"]
    volumes: *common-volumes
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:43123/v1/state"]
      interval: 2s
      timeout: 2s
      retries: 10

  gateway:
    build: *common-build
    user: claw
    working_dir: /opt/openclaw-test/src
    environment:
      OPENCLAW_CONFIG_PATH: /home/claw/.openclaw/openclaw.json
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENCLAW_TRAJECTORY_DIR: /home/claw/.openclaw/logs/trajectory
      OPENCLAW_RAW_STREAM: ${OPENCLAW_RAW_STREAM:-}
      OPENCLAW_TEST_RUNNER_URL: "http://runner:43124"
      PATH: "/opt/openclaw-test/mocks/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # Watcher in the background, then exec openclaw as PID 1's foreground process.
    command:
      ["sh", "-c",
       "/usr/local/bin/exec-watcher & exec npx openclaw gateway run --port 18789 --bind loopback --auth none"]
    volumes: *common-volumes
    depends_on:
      bus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(18789, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  runner:
    build: *common-build
    user: claw
    working_dir: /opt/openclaw-test/src
    environment:
      OPENCLAW_TEST_BUS_URL: http://bus:43123
      OPENCLAW_CONFIG_PATH: /home/claw/.openclaw/openclaw.json
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    entrypoint: ["node", "/opt/openclaw-test/src/dist/runner.js"]
    volumes: *common-volumes
    depends_on:
      bus:
        condition: service_healthy
      gateway:
        condition: service_healthy
