# Thin consumer overlay. Pulls in the parameterized base from
# @paleo/openclaw-test. Requires Docker Compose v2.20+.
#
# `.env.local` only needs ANTHROPIC_API_KEY and OPENCLAW_WORKSPACE_DIR.
# All other paths default to subdirs of the consumer's qa/ dir; override in
# .env.local if you need a different layout. QA_PROJECT_DIR, QA_RUNNER_PACKAGE_DIR,
# CLAW_UID, CLAW_GID are set automatically by `openclaw-test env|qa`.

include:
  - ./node_modules/@paleo/openclaw-test/docker-compose.yml
