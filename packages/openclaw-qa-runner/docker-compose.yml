x-common-build: &common-build
  context: ${QA_PROJECT_DIR}
  dockerfile: ${QA_RUNNER_PACKAGE_DIR}/Dockerfile
  args:
    CLAW_UID: ${CLAW_UID:-1000}
    CLAW_GID: ${CLAW_GID:-1000}

x-common-volumes: &common-volumes
  - ${OPENCLAW_WORKSPACE_DIR}:/home/claw/.openclaw/workspace
  - ${OPENCLAW_CONFIG_PATH}:/home/claw/.openclaw/openclaw.json
  - ${QA_PROJECTS_DIR}:/home/claw/projects/
  - ${QA_RUNNER_PACKAGE_DIR}/dist/:/opt/qa-src/dist
  - ${QA_SCENARIOS_DIR}:/opt/qa-src/scenarios
  - ${QA_ARTIFACTS_DIR}:/opt/qa-artifacts
  - ${QA_GATEWAY_LOGS_DIR}:/home/claw/.openclaw/logs

services:
  bus:
    build: *common-build
    user: claw
    working_dir: /opt/qa-src
    command: ["node", "/opt/qa-src/dist/bus.js"]
    volumes: *common-volumes
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:43123/v1/state"]
      interval: 2s
      timeout: 2s
      retries: 10

  gateway:
    build: *common-build
    user: claw
    working_dir: /opt/qa-src
    environment:
      OPENCLAW_CONFIG_PATH: /home/claw/.openclaw/openclaw.json
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENCLAW_ANTHROPIC_PAYLOAD_LOG: "1"
      OPENCLAW_RAW_STREAM: ${OPENCLAW_RAW_STREAM:-}
      QA_RUNNER_URL: "http://runner:43124"
      PATH: "/opt/qa-mocks/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    command: ["npx", "openclaw", "gateway", "run", "--port", "18789", "--bind", "loopback", "--auth", "none"]
    volumes: *common-volumes
    depends_on:
      bus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(18789, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  runner:
    build: *common-build
    user: claw
    working_dir: /opt/qa-src
    environment:
      QA_BUS_URL: http://bus:43123
      OPENCLAW_CONFIG_PATH: /home/claw/.openclaw/openclaw.json
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    entrypoint: ["node", "/opt/qa-src/dist/runner.js"]
    volumes: *common-volumes
    depends_on:
      bus:
        condition: service_healthy
      gateway:
        condition: service_healthy
