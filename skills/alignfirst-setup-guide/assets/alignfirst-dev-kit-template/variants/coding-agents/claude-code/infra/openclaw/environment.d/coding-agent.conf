# `alcode` selects the delegated coding agent CLI; `alignfirst` serves project-side protocols.
ALIGNFIRST_CODE_AGENT=claude
# Backgrounded runs have no approval loop: pass the CLI's permission-bypass flag.
ALIGNFIRST_CODE_SKIP_PERMISSIONS=1
# Stripped from the child so the agent uses its own login, never a stray API key.
ALIGNFIRST_CODE_UNSET=ANTHROPIC_API_KEY
