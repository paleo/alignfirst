# Read by managed projects' dev-server scripts that honor it (concurrent dev-server cap).
PROJECT_DEV_LIMIT=2
# Speeds up the gateway and every openclaw CLI call (each spawns Node).
NODE_COMPILE_CACHE=/home/{{SERVICE_USER}}/.cache/openclaw-compile-cache
OPENCLAW_NO_RESPAWN=1
# Ryuk is unreliable on rootless podman; testcontainers cleans up on its own.
TESTCONTAINERS_RYUK_DISABLED=true
# TEAM_PLANS_SECTION
# Project overlays stored in the team plans clone. The AlignFirst CLI expands the leading ~/.
ALIGNFIRST_OVERLAYS=~/projects/{{PLANS_CLONE_NAME}}
# TEAM_PLANS_SECTION
# DEV_SERVER_GATEWAY_SECTION
# Base domain of the remote dev URLs (workspace setup --profile remote).
REMOTE_DEV_DOMAIN={{DEV_DOMAIN}}
# DEV_SERVER_GATEWAY_SECTION
