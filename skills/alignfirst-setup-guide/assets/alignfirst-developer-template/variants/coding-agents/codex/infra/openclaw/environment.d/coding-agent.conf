# alcode selects the delegated coding agent CLI.
ALIGNFIRST_CODE_AGENT=codex
# Backgrounded runs have no approval loop: pass the CLI's approval-and-sandbox bypass flag.
ALIGNFIRST_CODE_SKIP_PERMISSIONS=1
# Stripped from the child. An OpenClaw Codex runtime exports CODEX_HOME and the two CODEX_MANAGED_*
# variables to every exec child; without stripping them, an alcode run started from a chat session
# inherits a credential-free agent-scoped Codex home and fails with 401. The two key names keep the
# child on its stored login instead of metered billing.
ALIGNFIRST_CODE_UNSET=OPENAI_API_KEY,CODEX_API_KEY,CODEX_HOME,CODEX_MANAGED_PACKAGE_ROOT,CODEX_MANAGED_BY_NPM
